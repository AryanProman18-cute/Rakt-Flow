<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#e11d48" />
  <meta name="description" content="RaktFlow verified blood donation and emergency logistics." />
  <title>RaktFlow — Blood logistics that move in time</title>
  
     <style>
    /* =========================================
       SAFE UI OVERRIDES
       ========================================= */

    /* 1. SQUISHED ICONS & DROPDOWNS FIX */
    body .role-option, body .nav-item, body .activity-item, body .check-row { 
      display: flex !important; align-items: center !important; 
    }
    body .icon, body .activity-icon, body .metric-icon, body .avatar, 
    body .dispatch-head-icon, body .network-icon, body .pin-head, body .role-option-icon { 
      flex-shrink: 0 !important; display: flex !important;
      align-items: center !important; justify-content: center !important;
    }
    body .icon svg { margin: auto !important; }
    
    /* 2. STOP SIDEBAR BLEEDING */
    body aside.sidebar { overflow-x: hidden !important; }
    body .nav-item { white-space: nowrap !important; }

    /* 3. TABLET COLLAPSE FIX (Hides text safely without breaking the dashboard) */
    @media (min-width: 769px) and (max-width: 1180px) {
      body .sidebar .nav-label,
      body .sidebar .nav-item span,
      body .sidebar .nav-item .nav-badge,
      body .sidebar .role-context,
      body .sidebar .brand-copy,
      body .sidebar .network-card > div:not(.network-icon) {
        display: none !important;
      }
      body .sidebar .nav-item {
        justify-content: center !important;
        padding: 0 !important;
      }
    }

    /* 4. MOBILE DASHBOARD & DARK MODE FIX */
    @media (max-width: 768px) { body .mobile-bottom-nav { display: none !important; } }
    
    [data-theme="dark"] body .dispatch-panel { 
      background: linear-gradient(145deg, var(--surface), color-mix(in srgb, var(--surface), var(--rose-600) 15%)) !important; 
      border-color: var(--border) !important; 
    }
    [data-theme="dark"] body .card[style*="background"], 
    [data-theme="dark"] body div[style*="background: var(--surface-soft)"] { 
      background: var(--surface-soft) !important; 
      color: var(--text) !important; 
    }
  </style>



</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div id="app"></div>
  <div id="modal-root"></div>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
