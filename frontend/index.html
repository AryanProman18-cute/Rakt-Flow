<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#e11d48" />
  <meta name="description" content="RaktFlow verified blood donation and emergency logistics." />
  <title>RaktFlow — Blood logistics that move in time</title>
  
       <style>
    /* =========================================
       BULLETPROOF UI OVERRIDES
       ========================================= */

    /* 1. SQUISHED ICONS & DROPDOWNS FIX */
    body .role-option, body .nav-item, body .activity-item, body .check-row { 
      display: flex !important; align-items: center !important; 
    }
    body .icon, body .activity-icon, body .metric-icon, body .avatar, 
    body .dispatch-head-icon, body .network-icon, body .pin-head, body .role-option-icon { 
      flex-shrink: 0 !important; display: flex !important;
      align-items: center !important; justify-content: center !important;
    }
    body .icon svg { margin: auto !important; }
    
    /* 2. STOP TEXT BLEEDING (Global) */
    body aside.sidebar { overflow-x: hidden !important; }
    body .nav-item, body .nav-label { white-space: nowrap !important; }

    /* 3. SIDEBAR COLLAPSE FIX (701px to 1180px)
       Catches iPads and small desktop windows without breaking the mobile menu */
    @media (min-width: 701px) and (max-width: 1180px) {
      body aside.sidebar { width: 82px !important; }
      
      /* Aggressively hides ANY text labels added to the sidebar */
      body aside.sidebar .nav-label, 
      body aside.sidebar .nav-item span, 
      body aside.sidebar .role-context, 
      body aside.sidebar .brand-copy,
      body aside.sidebar .network-card > div:not(.network-icon),
      body aside.sidebar > div:not(.brand):not(.side-nav):not(.sidebar-foot),
      body aside.sidebar nav > div,
      body aside.sidebar nav > span,
      body aside.sidebar nav > h1,
      body aside.sidebar nav > h2,
      body aside.sidebar nav > h3,
      body aside.sidebar nav > h4,
      body aside.sidebar nav > h5,
      body aside.sidebar nav > h6 { 
        display: none !important; 
      }
      body aside.sidebar .nav-item { justify-content: center !important; padding: 0 !important; }
    }

    /* 4. MOBILE DASHBOARD & DARK MODE FIX */
    @media (max-width: 700px) { body .mobile-bottom-nav { display: none !important; } }
    [data-theme="dark"] body .dispatch-panel { 
      background: linear-gradient(145deg, var(--surface), color-mix(in srgb, var(--surface), var(--rose-600) 15%)) !important; 
      border-color: var(--border) !important; 
    }
  </style>

</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div id="app"></div>
  <div id="modal-root"></div>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
