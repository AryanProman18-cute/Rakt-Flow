name: Apply RaktFlow V3.3 archive

on:
  push:
    branches:
      - v3.3-staging
    paths:
      - RaktFlow_v3_3_Final_Editable.zip

permissions:
  contents: write

jobs:
  apply-v33:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          ref: v3.3-staging
          fetch-depth: 0

      - name: Verify and extract V3.3
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="RaktFlow_v3_3_Final_Editable.zip"
          EXPECTED_SHA="7912f35fb303c7fe6f502b760bce4d7cd9e7702f76caa60bdd09851dc8938bec"
          EXTRACTED="$RUNNER_TEMP/raktflow-v33"

          test -f "$ARCHIVE"
          echo "$EXPECTED_SHA  $ARCHIVE" | sha256sum --check

          mkdir -p "$EXTRACTED"

          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          archive = Path("RaktFlow_v3_3_Final_Editable.zip")
          destination = Path("/tmp/raktflow-v33-safe")
          destination.mkdir(parents=True, exist_ok=True)
          root = destination.resolve()

          with ZipFile(archive) as source:
              for member in source.infolist():
                  target = (destination / member.filename).resolve()
                  if not target.is_relative_to(root):
                      raise RuntimeError(f"Unsafe archive path: {member.filename}")
              source.extractall(destination)
          PY

          test -f /tmp/raktflow-v33-safe/frontend/package.json
          test -f /tmp/raktflow-v33-safe/backend/Dockerfile
          test -f /tmp/raktflow-v33-safe/migrations/005_trust_logistics_and_mobile.sql
          test -f /tmp/raktflow-v33-safe/vercel.json

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name "$ARCHIVE" \
            -exec rm -rf {} +

          cp -a /tmp/raktflow-v33-safe/. .
          rm -f "$ARCHIVE"

      - name: Commit extracted V3.3 source
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "RaktFlow Release Workflow"
          git config user.email "actions@users.noreply.github.com"

          git add --all

          if git diff --cached --quiet; then
            echo "No source changes were found."
            exit 0
          fi

          git commit -m "Apply RaktFlow V3.3 combined update"
          git push origin HEAD:v3.3-staging
