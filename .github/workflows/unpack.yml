name: Unpack RaktFlow V3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Extract RaktFlow source
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found."
            exit 1
          fi

          unzip -o "$ZIP_FILE" -d .
          rm "$ZIP_FILE"

          # GitHub blocks Actions from creating other workflow files.
          rm -f .github/workflows/ci.yml
          rm -f .github/workflows/keep-warm.yml

      - name: Save extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Unpack RaktFlow V3 source"
          git push
